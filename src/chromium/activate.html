<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bitrix24 Быстрые ссылки</title>
    <link rel="stylesheet" href="activate.css">
  </head>
  <body>
    <main class="activation">
      <div class="activation__mark" aria-hidden="true">24</div>
      <div>
        <h1>Быстрые ссылки</h1>
        <p id="activation-status">Проверяем открытую страницу...</p>
        <p id="activation-host" class="activation__host" hidden></p>
      </div>
      <button id="activation-button" type="button" disabled>Активировать на портале</button>
      <p class="activation__hint">Доступ предоставляется только текущему порталу и сохраняется в браузере.</p>
    </main>
    <script src="activate.js"></script>
  </body>
</html>
